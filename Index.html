<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine 💖</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .container {
      text-align: center;
      color: white;
      z-index: 2;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 10px;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
    }

    p {
      font-size: 1.3em;
      margin-bottom: 30px;
    }

    button {
      font-size: 1.2em;
      padding: 12px 35px;
      margin: 10px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
    }

    #yes {
      background: #ff4d6d;
      color: white;
    }

    #no {
      background: white;
      color: #ff4d6d;
      position: absolute;
    }

    .heart {
      position: absolute;
      width: 20px;
      height: 20px;
      background: red;
      transform: rotate(45deg);
      animation: float 6s infinite ease-in;
    }

    .heart::before,
    .heart::after {
      content: '';
      width: 20px;
      height: 20px;
      background: red;
      border-radius: 50%;
      position: absolute;
    }

    .heart::before {
      top: -10px;
      left: 0;
    }

    .heart::after {
      left: -10px;
      top: 0;
    }

    @keyframes float {
      0% { bottom: -10%; opacity: 0; }
      50% { opacity: 1; }
      100% { bottom: 110%; opacity: 0; }
    }
  </style>
</head>

<body>

  <!-- الأغنية -->
 <audio id="song" loop>
  <source src="ana_aktar_wahed_beyehbak.mp3" type="audio/mpeg">
</audio>

  <div class="container">
    <h1>Will you be my Valentine Reka (لحد ما ابن الحلال يجى)? 💘</h1>
    <p>You can’t say no 😌</p>

    <button id="yes">Yes 💖</button>
    <button id="no">No 💔</button>
  </div>

  <script>
    // زر No يهرب
    const noBtn = document.getElementById("no");

    noBtn.addEventListener("mouseover", () => {
      const x = Math.random() * (window.innerWidth - 100);
      const y = Math.random() * (window.innerHeight - 50);
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    });

    // زر Yes
   document.getElementById("yes").addEventListener("click", () => {
  const song = document.getElementById("song");
song.currentTime = 25;
song.play();

  // إخفاء الأزرار
  document.getElementById("yes").style.display = "none";
  document.getElementById("no").style.display = "none";

  let images = ["4.jpg", "3.jpg", "2.jpg", "1.jpg"];
  let index = 0;

  const container = document.querySelector(".container");

  // إضافة الصور بدون مسح الصفحة
  const title = document.createElement("h1");
  title.innerText = "Our Memories 💖";

  const img = document.createElement("img");
  img.src = images[0];
  img.style.width = "320px";
  img.style.borderRadius = "20px";
  img.style.boxShadow = "0 10px 25px rgba(0,0,0,0.4)";
  img.style.marginTop = "20px";
  img.style.transition = "opacity 1s";

  const text = document.createElement("p");
  text.innerText = "Forever Together 💞";
  text.style.marginTop = "15px";

  container.appendChild(title);
  container.appendChild(img);
  container.appendChild(text);

  setInterval(() => {
    index = (index + 1) % images.length;
    img.style.opacity = 0;

    setTimeout(() => {
      img.src = images[index];
      img.style.opacity = 1;
    }, 500);
  }, 2000);
});

    // قلوب طايرة
    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (Math.random() * 3 + 3) + "s";
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 6000);
    }

    setInterval(createHeart, 300);
  </script>

</body>
</html>
